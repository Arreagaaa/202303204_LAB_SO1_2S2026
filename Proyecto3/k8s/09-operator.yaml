apiVersion: v1
kind: ServiceAccount
metadata:
  name: mumnk8s-operator
  namespace: mumnk8s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mumnk8s-operator
  namespace: mumnk8s
rules:
  - apiGroups: ["mumnk8s.sopes1.usac"]
    resources: ["valkeyinstances", "valkeyinstances/status", "valkeyinstances/finalizers", "grafanainstances", "grafanainstances/status", "grafanainstances/finalizers"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["*"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "configmaps", "secrets", "events", "pods"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mumnk8s-operator
  namespace: mumnk8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mumnk8s-operator
subjects:
  - kind: ServiceAccount
    name: mumnk8s-operator
    namespace: mumnk8s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mumnk8s-operator
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mumnk8s-operator
  template:
    metadata:
      labels:
        app: mumnk8s-operator
    spec:
      serviceAccountName: mumnk8s-operator
      containers:
        - name: operator
          image: zot.example/mumnk8s/operator:dev
          args:
            - run
            - --watches-file=./watches.yaml
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
