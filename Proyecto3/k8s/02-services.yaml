apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      containers:
        - name: api-rust
          image: zot.example/mumnk8s/api-rust:dev
          ports:
            - containerPort: 8080
          env:
            - name: INGEST_URL
              value: http://go-ingest:8081/reports
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-rust
  namespace: mumnk8s
spec:
  selector:
    app: api-rust
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-ingest
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-ingest
  template:
    metadata:
      labels:
        app: go-ingest
    spec:
      containers:
        - name: go-ingest
          image: zot.example/mumnk8s/go-ingest:dev
          ports:
            - containerPort: 8081
          env:
            - name: WRITER_ADDRESS
              value: go-writer:50051
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: go-ingest
  namespace: mumnk8s
spec:
  selector:
    app: go-ingest
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-writer
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-writer
  template:
    metadata:
      labels:
        app: go-writer
    spec:
      containers:
        - name: go-writer
          image: zot.example/mumnk8s/go-writer:dev
          ports:
            - containerPort: 50051
          env:
            - name: RABBITMQ_ADDRESS
              value: amqp://guest:x@rabbitmq:5672/
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: go-writer
  namespace: mumnk8s
spec:
  selector:
    app: go-writer
  ports:
    - port: 50051
      targetPort: 50051
