apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: zot.example/mumnk8s/consumer:dev
          env:
            - name: RABBITMQ_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: uri
            - name: VALKEY_ADDRESS
              value: valkey-reports:6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
