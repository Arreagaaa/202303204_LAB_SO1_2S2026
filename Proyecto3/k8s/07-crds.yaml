  names:
    plural: grafanainstances
    singular: grafanainstance
    kind: GrafanaInstance
    shortNames: [gfi]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            spec:
              type: object
              properties:
                service:
                  type: object
