apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: valkeyinstances.mumnk8s.sopes1.usac
spec:
  group: mumnk8s.sopes1.usac
  scope: Namespaced
  names:
    plural: valkeyinstances
    singular: valkeyinstance
    kind: ValkeyInstance
    shortNames: [vki]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            spec:
              type: object
              properties:
                replicaCount:
                  type: integer
                  minimum: 1
                storage:
                  type: string
                  pattern: '^([0-9]+)(Mi|Gi)$'
                maxMemory:
                  type: string
                  pattern: '^([0-9]+)(mb|gb)$'
                image:
                  type: object
                  properties:
                    repository:
                      type: string
                    tag:
                      type: string
---
