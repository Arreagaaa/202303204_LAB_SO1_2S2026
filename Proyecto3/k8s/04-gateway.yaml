apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mumnk8s-gateway
  namespace: mumnk8s
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mumnk8s-route
  namespace: mumnk8s
spec:
  parentRefs:
    - name: mumnk8s-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grpc-202303204
      backendRefs:
        - name: api-rust
          port: 80
