apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics
  template:
    metadata:
      labels:
        app: metrics
    spec:
      containers:
        - name: metrics
          image: zot.example/mumnk8s/metrics:dev
          ports:
            - containerPort: 9091
          env:
            - name: VALKEY_ADDRESS
              value: valkey-reports:6379
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics
  namespace: mumnk8s
spec:
  selector:
    app: metrics
  ports:
    - port: 9091
      targetPort: 9091
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mumnk8s
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: military-reports
        static_configs:
          - targets: ["metrics:9091"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: zot.example/mumnk8s/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: mumnk8s
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mumnk8s
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
