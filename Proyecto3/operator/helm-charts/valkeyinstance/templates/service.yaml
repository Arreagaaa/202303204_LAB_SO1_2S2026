apiVersion: v1
kind: Service
metadata:
  name: {{ include "valkeyinstance.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "valkeyinstance.name" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "valkeyinstance.name" . }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
