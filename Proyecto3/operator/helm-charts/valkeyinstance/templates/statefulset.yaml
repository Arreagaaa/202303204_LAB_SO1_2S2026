apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "valkeyinstance.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "valkeyinstance.name" . }}
spec:
  serviceName: {{ include "valkeyinstance.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "valkeyinstance.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "valkeyinstance.name" . }}
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["valkey-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage }}
