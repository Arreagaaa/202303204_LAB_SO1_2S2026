apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "valkeyinstance.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "valkeyinstance.name" . }}
spec:
  serviceName: {{ include "valkeyinstance.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "valkeyinstance.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "valkeyinstance.name" . }}
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["valkey-server", "--appendonly", "yes", "--maxmemory", {{ .Values.maxMemory | quote }}, "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage }}
