apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grafanainstance.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "grafanainstance.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "grafanainstance.name" . }}
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafanainstance.fullname" . }}
                  key: admin-password
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
      volumes:
        - name: provisioning
          configMap:
            name: {{ include "grafanainstance.fullname" . }}
