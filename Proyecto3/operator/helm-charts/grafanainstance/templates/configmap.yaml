apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafanainstance.fullname" . }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: mumnk8s
        type: file
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
  dashboard.json: |
{{ .Files.Get "dashboards/reports.json" | indent 4 }}
