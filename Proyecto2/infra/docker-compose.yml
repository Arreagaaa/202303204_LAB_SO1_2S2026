services:
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: so1-pr2-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    networks:
      - so1-net

  grafana:
    image: grafana/grafana:12.1.1
    container_name: so1-pr2-grafana
    restart: unless-stopped
    depends_on:
      - valkey
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: x
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - so1-net

volumes:
  valkey-data:
  grafana-data:

networks:
  so1-net:
    name: so1-net
